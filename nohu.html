<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunbịp - Nổ Hũ 7x5 VIP (Lên Voi Xuống Chó)</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    .slot-container-7x5 {
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      border: 3px solid #f59e0b;
      border-radius: 20px;
      padding: 10px;
      width: 100%;
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.3);
      text-align: center;
      margin: 4px 0;
      position: relative;
    }
    .jackpot-display-v3 {
      background: #000;
      border: 2px solid #fbbf24;
      color: #fbbf24;
      font-size: 20px;
      font-weight: 900;
      border-radius: 10px;
      padding: 6px;
      margin-bottom: 6px;
    }
    .grid-7x5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(7, 1fr);
      gap: 4px;
      background: #020617;
      padding: 6px;
      border-radius: 12px;
      border: 2px solid #a855f7;
      max-height: 400px;
      overflow: hidden;
    }
    .slot-cell {
      height: 46px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }
    .slot-cell.exploding {
      transform: scale(0);
      opacity: 0;
      background: #ef4444 !important;
    }
    .slot-cell.scatter-cell {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.4);
      box-shadow: 0 0 12px #f59e0b;
    }
    .multiplier-badge {
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      padding: 2px 10px;
      border-radius: 15px;
      display: inline-block;
      margin-bottom: 4px;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }
    .free-spins-counter {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      padding: 3px 12px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 4px;
    }
    .win-popup-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99;
      border-radius: 20px;
      animation: fadeInPopup 0.3s ease;
    }
    .win-popup-content {
      background: linear-gradient(135deg, #b45309, #f59e0b);
      border: 3px solid #fef08a;
      padding: 18px 24px;
      border-radius: 20px;
      text-align: center;
      max-width: 85%;
    }
    .win-popup-title { font-size: 18px; font-weight: 900; color: #fff; }
    .win-popup-amount { font-size: 26px; font-weight: 900; color: #fef08a; text-shadow: 0 0 10px #000; margin: 6px 0; }
    .win-popup-sub { font-size: 12px; font-weight: bold; color: #fff; margin-bottom: 8px; }
    .win-popup-timer { font-size: 11px; color: #fef08a; font-weight: bold; margin-top: 6px; }
    
    @keyframes fadeInPopup {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .bet-selector-row { display: flex; gap: 4px; justify-content: center; margin: 6px 0; flex-wrap: wrap; }
    .btn-bet-opt { background: #334155; border: 1px solid #475569; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .btn-bet-opt.active { background: #a855f7; border-color: #c084fc; }
    .btn-buy-scatter { background: linear-gradient(135deg, #ec4899, #8b5cf6); border: 2px solid #f472b6; color: #fff; padding: 6px 12px; border-radius: 10px; font-weight: 900; font-size: 11px; cursor: pointer; }
    .auto-panel { display: flex; gap: 4px; justify-content: center; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 8px; margin-top: 6px; }
    .btn-auto-item { background: #1e293b; border: 1px solid #475569; color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .btn-auto-item.active { background: #ec4899; }
    .btn-spin-7x5 { background: linear-gradient(135deg, #f59e0b, #d97706); border: 2px solid #fef08a; color: #fff; font-size: 15px; font-weight: 900; padding: 10px 0; border-radius: 20px; cursor: pointer; margin-top: 6px; width: 100%; transition: all 0.2s; }
    .btn-spin-7x5:disabled { background: #64748b; border-color: #94a3b8; cursor: not-allowed; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="casino-app">
    <header class="game-header">
      <div class="header-left">
        <button onclick="stopAutoSpin(); location.href='index.html'" style="background:#334155; border:none; color:#fff; padding:4px 8px; border-radius:6px; cursor:pointer; font-weight:bold; margin-right:6px; font-size: 11px;">⬅ Sảnh</button>
        <div class="logo">🎰 NỔ<span>HŨ</span></div>
      </div>
      <div class="header-right">
        <div class="balance-card">
          <span class="coin-icon">💰</span>
          <span id="balance">0</span> đ
        </div>
      </div>
    </header>

    <main class="casino-board">
      <div class="slot-container-7x5">
        <div class="win-popup-overlay" id="win-popup">
          <div class="win-popup-content">
            <div class="win-popup-title" id="popup-title">🎉 THẮNG LỚN! 🎉</div>
            <div class="win-popup-amount" id="popup-amount">+0đ</div>
            <div class="win-popup-sub" id="popup-sub" style="display:none;"></div>
            <button class="btn-confirm" onclick="closeWinPopup()" style="padding: 8px 22px; font-size: 13px; background: #22c55e; color: #fff; border: 2px solid #fff; border-radius: 10px; font-weight: 900; cursor: pointer;">NHẬN THƯỞNG</button>
            <div class="win-popup-timer" id="popup-timer">3s...</div>
          </div>
        </div>

        <div class="jackpot-display-v3">💰 HŨ: <span id="jackpot-val">10,000,000</span>đ</div>

        <div id="free-spins-box" style="display: none;">
          <div class="free-spins-counter">🎁 FREE SPINS: <span id="fs-count">0</span></div>
        </div>

        <div id="multiplier-box" style="display: none;">
          <div class="multiplier-badge">HỆ SỐ NHÂN LƯỢT ĂN: <span id="multi-val">x1</span></div>
        </div>

        <div class="grid-7x5" id="grid-board"></div>

        <div class="result-banner" id="nohu-banner" style="margin-top: 6px; min-height: 20px;">+0đ</div>

        <div class="bet-selector-row">
          <button class="btn-bet-opt active" onclick="setBet(400, this)">0.4K</button>
          <button class="btn-bet-opt" onclick="setBet(1000, this)">1K</button>
          <button class="btn-bet-opt" onclick="setBet(5000, this)">5K</button>
          <button class="btn-bet-opt" onclick="setBet(10000, this)">10K</button>
          <button class="btn-bet-opt" onclick="setBet(50000, this)">50K</button>
          <button class="btn-bet-opt" onclick="setBet(100000, this)">100K</button>
          <button class="btn-bet-opt" onclick="setBet(500000, this)">500K</button>
          <button class="btn-bet-opt" onclick="setBet(1000000, this)">1M</button>
        </div>

        <div>
          <button class="btn-buy-scatter" onclick="buyScatterFeature()">⚡ MUA SCATTER (<span id="buy-price">30,000</span>đ)</button>
        </div>

        <div class="auto-panel">
          <span style="font-size: 10px; color: #cbd5e1; align-self: center; font-weight: bold;">AUTO:</span>
          <button class="btn-auto-item active" onclick="setAutoMode(0, this)">TẮT</button>
          <button class="btn-auto-item" onclick="setAutoMode(10, this)">10</button>
          <button class="btn-auto-item" onclick="setAutoMode(50, this)">50</button>
          <button class="btn-auto-item" onclick="setAutoMode(100, this)">100</button>
          <button class="btn-auto-item" onclick="setAutoMode('INFINITY', this)">♾️</button>
        </div>

        <button class="btn-spin-7x5" id="btn-spin" onclick="handleSpinClick()">🎰 QUAY NGAY</button>
      </div>
    </main>
  </div>

  <script>
    let balance = localStorage.getItem('sunbip_balance') !== null ? parseFloat(localStorage.getItem('sunbip_balance')) : 100000;
    let jackpot = localStorage.getItem('sunbip_jackpot') !== null ? parseFloat(localStorage.getItem('sunbip_jackpot')) : 10000000;
    
    let currentBet = 400;
    let freeSpinsRemaining = 0;
    let autoRemaining = 0;
    let isSpinning = false;
    
    // Hệ số mặc định quay thường là x1
    let currentSpinMultiplier = 1; 
    let cascadeSteps = 0;
    
    let sessionTotalWin = 0;
    let freeSpinAccumulatedWin = 0;
    let isScatterSessionActive = false; 

    let waitingForScatterConfirm = false;
    let popupAutoCloseTimer = null;
    let popupTimerTick = null;

    let gridData = Array(7).fill(null).map(() => Array(5).fill('💎'));
    const symbolSpawnPooL = ['🍋', '🍋', '🍋', '🍉', '🍉', '🔔', '🔔', '7️⃣', '👑', '💎'];
    
    const symbolWeights = { 
      '🍋': 0.04,  
      '🍉': 0.08,  
      '🔔': 0.20,  
      '7️⃣': 0.5,   
      '👑': 2.0,  
      '💎': 6.0   
    };

    const balanceEl = document.getElementById('balance');
    const jackpotEl = document.getElementById('jackpot-val');
    const banner = document.getElementById('nohu-banner');
    const btnSpin = document.getElementById('btn-spin');
    const gridBoard = document.getElementById('grid-board');
    const buyPriceEl = document.getElementById('buy-price');

    if (balanceEl) balanceEl.textContent = Math.round(balance).toLocaleString();
    if (jackpotEl) jackpotEl.textContent = Math.round(jackpot).toLocaleString();

    function initBoard() {
      if (!gridBoard) return;
      gridBoard.innerHTML = '';
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          const cell = document.createElement('div');
          cell.className = 'slot-cell';
          cell.id = `cell-${r}-${c}`;
          cell.textContent = getRandomSymbol();
          gridBoard.appendChild(cell);
        }
      }
    }

    function getRandomSymbol() {
      return symbolSpawnPooL[Math.floor(Math.random() * symbolSpawnPooL.length)];
    }

    initBoard();

    function setBet(val, btn) {
      if (isSpinning || waitingForScatterConfirm) return;
      currentBet = val;
      document.querySelectorAll('.btn-bet-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      let buyCost = Math.round(currentBet * 75);
      if (buyPriceEl) buyPriceEl.textContent = buyCost.toLocaleString();
    }

    function setAutoMode(mode, btn) {
      if (isSpinning) return;
      autoRemaining = mode;
      document.querySelectorAll('.btn-auto-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function handleSpinClick() {
      if (waitingForScatterConfirm) {
        closeWinPopup();
        return;
      }
      if (autoRemaining !== 0 && isSpinning) { 
        stopAutoSpin(); 
        return; 
      }
      spinSlot(false);
    }

    function stopAutoSpin() {
      autoRemaining = 0;
      if (btnSpin) {
        btnSpin.disabled = false;
        btnSpin.textContent = '🎰 QUAY NGAY';
      }
      document.querySelectorAll('.btn-auto-item').forEach(b => b.classList.remove('active'));
      if (document.querySelectorAll('.btn-auto-item')[0]) {
        document.querySelectorAll('.btn-auto-item')[0].classList.add('active');
      }
    }

    function buyScatterFeature() {
      if (isSpinning || waitingForScatterConfirm) return;
      let buyCost = Math.round(currentBet * 75);
      if (balance < buyCost) {
        if (banner) {
          banner.textContent = `❌ Không đủ tiền (${buyCost.toLocaleString()}đ)!`;
          banner.style.color = '#f87171';
        }
        return;
      }
      balance -= buyCost;
      saveData();
      updateUI();
      spinSlot(true);
    }

    function spinSlot(isBuyFeature = false) {
      if (isSpinning) return;
      if (!isBuyFeature && freeSpinsRemaining <= 0 && balance < currentBet) {
        if (banner) {
          banner.textContent = "❌ Số dư không đủ!";
          banner.style.color = "#f87171";
        }
        stopAutoSpin();
        return;
      }

      isSpinning = true;
      sessionTotalWin = 0; 
      
      if (freeSpinsRemaining <= 0 && !isScatterSessionActive) {
        freeSpinAccumulatedWin = 0;
      }

      if (btnSpin) {
        btnSpin.disabled = true;
        btnSpin.textContent = "🌀 ĐANG QUAY";
      }
      cascadeSteps = 0;
      
      // LOGIC MỚI: Cứ mỗi vòng quay mới (new spin) trong chuỗi Free Spin, hệ số khởi điểm reset về x8[cite: 4]
      if (freeSpinsRemaining > 0 || isScatterSessionActive) {
        currentSpinMultiplier = 8; 
      } else {
        currentSpinMultiplier = 1;
      }

      const multiBox = document.getElementById('multiplier-box');
      const multiVal = document.getElementById('multi-val');
      if (multiBox) multiBox.style.display = 'block';
      if (multiVal) multiVal.textContent = `x${currentSpinMultiplier}`;

      if (freeSpinsRemaining > 0) {
        freeSpinsRemaining--;
        updateFreeSpinsUI();
      } else if (!isBuyFeature) {
        balance -= currentBet;
        jackpot += Math.floor(currentBet * 0.05);
        saveData();
        updateUI();
      }

      if (banner) {
        banner.style.color = '#fbbf24';
        let currentDisplay = (freeSpinsRemaining > 0 || isScatterSessionActive) ? freeSpinAccumulatedWin : 0;
        banner.textContent = `+${Math.round(currentDisplay).toLocaleString()}đ`;
      }
      
      let count = 0;
      let spinInterval = setInterval(() => {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 5; c++) {
            let cell = document.getElementById(`cell-${r}-${c}`);
            if (cell) cell.textContent = getRandomSymbol();
          }
        }
        count++;
        if (count > 11) {
          clearInterval(spinInterval);
          generateBoardResult(isBuyFeature);
        }
      }, 100);
    }

    function generateBoardResult(isBuyFeature) {
      gridData = Array(7).fill(null).map(() => Array(5).fill(null));

      if (isBuyFeature) {
        let scatterAmount = Math.random() > 0.9 ? 5 : (Math.random() > 0.6 ? 4 : 3);
        let placed = 0;
        while (placed < scatterAmount) {
          let r = Math.floor(Math.random() * 7);
          let c = Math.floor(Math.random() * 5);
          if (gridData[r][c] !== '♾️') { gridData[r][c] = '♾️'; placed++; }
        }
      } else {
        let chance = Math.random();
        if (chance < 0.025) {
          let scatterAmount = chance < 0.003 ? 5 : (chance < 0.01 ? 4 : 3);
          let placed = 0;
          while (placed < scatterAmount) {
            let r = Math.floor(Math.random() * 7);
            let c = Math.floor(Math.random() * 5);
            if (gridData[r][c] !== '♾️') { gridData[r][c] = '♾️'; placed++; }
          }
        }
      }

      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          if (gridData[r][c] !== '♾️') {
            gridData[r][c] = getRandomSymbol();
          }
        }
      }
      renderGridUI();
      checkClusterAndCascade();
    }

    function renderGridUI() {
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          let el = document.getElementById(`cell-${r}-${c}`);
          if (el) {
            el.textContent = gridData[r][c] || '';
            if (gridData[r][c] === '♾️') el.classList.add('scatter-cell');
            else el.classList.remove('scatter-cell', 'exploding');
          }
        }
      }
    }

    function checkClusterAndCascade() {
      cascadeSteps++;
      if (cascadeSteps > 15) { endSpinSession(); return; }

      let visited = Array(7).fill(null).map(() => Array(5).fill(false));
      let matchedClusters = [];
      let scatterCount = 0;

      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          let sym = gridData[r][c];
          if (sym === '♾️') { scatterCount++; continue; }
          if (!sym || visited[r][c]) continue;

          let cluster = [];
          let queue = [[r, c]];
          visited[r][c] = true;

          while (queue.length > 0) {
            let [currR, currC] = queue.shift();
            cluster.push([currR, currC]);

            let neighbors = [
              [currR - 1, currC], [currR + 1, currC],
              [currR, currC - 1], [currR, currC + 1]
            ];

            for (let [nR, nC] of neighbors) {
              if (nR >= 0 && nR < 7 && nC >= 0 && nC < 5 && !visited[nR][nC] && gridData[nR][nC] === sym) {
                visited[nR][nC] = true;
                queue.push([nR, nC]);
              }
            }
          }

          if (cluster.length >= 5) {
            matchedClusters.push({ sym: sym, cells: cluster });
          }
        }
      }

      if (scatterCount >= 3) {
        let addedSpins = 10 + (scatterCount - 3) * 2;
        freeSpinsRemaining += addedSpins;
        isScatterSessionActive = true;
        currentSpinMultiplier = 8; // Bắt đầu chuỗi free spins với hệ số x8[cite: 4]
        
        updateFreeSpinsUI();
        const multiBox = document.getElementById('multiplier-box');
        const multiVal = document.getElementById('multi-val');
        if (multiBox) multiBox.style.display = 'block';
        if (multiVal) multiVal.textContent = `x${currentSpinMultiplier}`;

        if (typeof confetti === 'function') confetti({ particleCount: 250, spread: 120 });

        showScatterWinPopup(scatterCount, addedSpins, freeSpinAccumulatedWin);
        return;
      }

      if (matchedClusters.length > 0) {
        const multiBox = document.getElementById('multiplier-box');
        const multiVal = document.getElementById('multi-val');
        if (multiBox) multiBox.style.display = 'block';
        if (multiVal) multiVal.textContent = `x${currentSpinMultiplier}`;

        let stepWin = 0;
        matchedClusters.forEach(clusterObj => {
          let weight = symbolWeights[clusterObj.sym] || 0.04;
          let clusterValue = clusterObj.cells.length * currentBet * weight * currentSpinMultiplier;
          stepWin += clusterValue;

          clusterObj.cells.forEach(([r, c]) => {
            let cell = document.getElementById(`cell-${r}-${c}`);
            if (cell) cell.classList.add('exploding');
            gridData[r][c] = null;
          });
        });

        sessionTotalWin += stepWin;
        freeSpinAccumulatedWin += stepWin;
        balance += stepWin;

        if (banner) {
          banner.style.color = '#fbbf24';
          let activeWinDisplay = (freeSpinsRemaining > 0 || isScatterSessionActive) ? freeSpinAccumulatedWin : sessionTotalWin;
          banner.textContent = `+${Math.round(activeWinDisplay).toLocaleString()}đ`;
        }
        saveData();
        updateUI();

        // Trong cùng vòng quay, tiếp tục nhân đôi hệ số khi nổ cụm tiếp theo (tối đa 1024)[cite: 4]
        if (currentSpinMultiplier < 1024) {
          currentSpinMultiplier *= 2;
          if (multiVal) multiVal.textContent = `x${currentSpinMultiplier}`;
        }

        setTimeout(() => { applySlideDownAndFillAll(); }, 400);
      } else {
        endSpinSession();
      }
    }

    function applySlideDownAndFillAll() {
      for (let c = 0; c < 5; c++) {
        let writeRow = 6;
        for (let r = 6; r >= 0; r--) {
          if (gridData[r][c] !== null) {
            gridData[writeRow][c] = gridData[r][c];
            if (writeRow !== r) gridData[r][c] = null;
            writeRow--;
          }
        }
        for (let r = writeRow; r >= 0; r--) {
          gridData[r][c] = getRandomSymbol();
        }
      }
      renderGridUI();
      setTimeout(() => { checkClusterAndCascade(); }, 350);
    }

    function endSpinSession() {
      isSpinning = false;

      if (freeSpinsRemaining > 0) {
        setTimeout(() => {
          spinSlot(false);
        }, 700);
        return;
      }

      if (isScatterSessionActive) {
        isScatterSessionActive = false;
        showScatterFinalWinPopup(freeSpinAccumulatedWin);
        return;
      }

      let finalDisplay = (freeSpinAccumulatedWin > 0) ? freeSpinAccumulatedWin : sessionTotalWin;
      if (banner) {
        banner.style.color = finalDisplay > 0 ? '#4ade80' : '#cbd5e1';
        banner.textContent = `+${Math.round(finalDisplay).toLocaleString()}đ`;
      }

      finishSpinState();
    }

    function finishSpinState() {
      if (autoRemaining !== 0) {
        if (typeof autoRemaining === 'number') {
          autoRemaining--;
          if (autoRemaining <= 0) { stopAutoSpin(); return; }
        }
        setTimeout(() => {
          let popupEl = document.getElementById('win-popup');
          if (!popupEl || popupEl.style.display === 'none') {
            spinSlot(false);
          }
        }, 800);
      } else {
        if (btnSpin) {
          btnSpin.disabled = false;
          btnSpin.textContent = '🎰 QUAY NGAY';
        }
      }
    }

    function showScatterWinPopup(count, spins, currentTotalWin) {
      const titleEl = document.querySelector('.win-popup-title');
      const amountEl = document.getElementById('popup-amount');
      const subEl = document.getElementById('popup-sub');
      const popupEl = document.getElementById('win-popup');
      const timerEl = document.getElementById('popup-timer');

      if (titleEl) titleEl.textContent = '⚡ TRÚNG FREE SPINS! ⚡';
      if (amountEl) amountEl.textContent = `+${spins} VÒNG QUAY`;
      
      if (subEl) {
        subEl.style.display = 'block';
        subEl.textContent = `VÀO VÒNG FREE SPIN (Hệ số bắt đầu x8 mỗi lượt)`;
      }

      if (popupEl) popupEl.style.display = 'flex';

      let secLeft = 5;
      if (timerEl) timerEl.textContent = `Tự động vào sau ${secLeft}s...`;

      waitingForScatterConfirm = true;
      if (btnSpin) {
        btnSpin.disabled = false;
        btnSpin.textContent = `✔ XÁC NHẬN (${secLeft}s)`;
      }

      clearInterval(popupTimerTick);
      popupTimerTick = setInterval(() => {
        secLeft--;
        if (secLeft > 0) {
          if (timerEl) timerEl.textContent = `Tự động vào sau ${secLeft}s...`;
          if (waitingForScatterConfirm && btnSpin) btnSpin.textContent = `✔ XÁC NHẬN (${secLeft}s)`;
        } else {
          clearInterval(popupTimerTick);
          if (waitingForScatterConfirm) {
            closeWinPopup();
          }
        }
      }, 1000);
    }

    function proceedFreeSpinsSequence() {
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          if (gridData[r][c] === '♾️') {
            let cell = document.getElementById(`cell-${r}-${c}`);
            if (cell) cell.classList.add('exploding');
            gridData[r][c] = null;
          }
        }
      }
      setTimeout(() => { applySlideDownAndFillAll(); }, 350);
    }

    function showScatterFinalWinPopup(totalAmount) {
      const titleEl = document.querySelector('.win-popup-title');
      const amountEl = document.getElementById('popup-amount');
      const subEl = document.getElementById('popup-sub');
      const popupEl = document.getElementById('win-popup');
      const timerEl = document.getElementById('popup-timer');

      if (titleEl) titleEl.textContent = '🎁 KẾT THÚC CHUỖI FREE SPINS! 🎁';
      if (amountEl) amountEl.textContent = `+${Math.round(totalAmount).toLocaleString()}đ`;
      
      if (subEl) {
        subEl.style.display = 'block';
        subEl.textContent = `TỔNG TIỀN THẮNG FREE SPIN`;
      }

      if (popupEl) popupEl.style.display = 'flex';
      if (typeof confetti === 'function') confetti({ particleCount: 300, spread: 130 });

      let secLeft = 4;
      if (timerEl) timerEl.textContent = `Tự nhận sau ${secLeft}s...`;
      
      clearInterval(popupTimerTick);
      popupTimerTick = setInterval(() => {
        secLeft--;
        if (secLeft > 0) {
          if (timerEl) timerEl.textContent = `Tự nhận sau ${secLeft}s...`;
        } else {
          clearInterval(popupTimerTick);
        }
      }, 1000);

      clearTimeout(popupAutoCloseTimer);
      popupAutoCloseTimer = setTimeout(() => { closeWinPopup(); }, 4000);
    }

    function closeWinPopup() {
      clearTimeout(popupAutoCloseTimer);
      clearInterval(popupTimerTick);
      const popupEl = document.getElementById('win-popup');
      if (popupEl) popupEl.style.display = 'none';

      if (waitingForScatterConfirm) {
        waitingForScatterConfirm = false;
        if (btnSpin) {
          btnSpin.disabled = true;
          btnSpin.textContent = '🌀 ĐANG QUAY';
        }
        proceedFreeSpinsSequence();
        return;
      }

      finishSpinState();
    }

    function updateFreeSpinsUI() {
      const fsBox = document.getElementById('free-spins-box');
      const fsCount = document.getElementById('fs-count');
      if (freeSpinsRemaining > 0) {
        if (fsBox) fsBox.style.display = 'block';
        if (fsCount) fsCount.textContent = freeSpinsRemaining;
      } else {
        if (fsBox) fsBox.style.display = 'none';
      }
    }

    function updateUI() {
      if (balanceEl) balanceEl.textContent = Math.round(balance).toLocaleString();
      if (jackpotEl) jackpotEl.textContent = Math.round(jackpot).toLocaleString();
    }

    function saveData() {
      localStorage.setItem('sunbip_balance', balance);
      localStorage.setItem('sunbip_jackpot', jackpot);
    }
  </script>
</body>
</html>
