<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunbịp - Nổ Hũ 7x5 VIP (Lên Voi Xuống Chó)</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    body { 
      background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 100%); 
      color: #fff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 8px; 
    }
    .casino-app { 
      width: 100%; 
      max-width: 430px; 
      background: #0f172a; 
      border-radius: 24px; 
      padding: 12px; 
      border: 1px solid #334155; 
      box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1); 
    }
    
    /* HEADER */
    .game-header { display: flex; justify-content: space-between; align-items: center; padding: 2px 2px 10px; }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .btn-back { background: #1e293b; border: 1px solid #475569; color: #cbd5e1; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 11px; transition: 0.2s; }
    .btn-back:hover:not(:disabled) { background: #334155; color: #fff; }
    .logo { font-weight: 900; font-size: 17px; color: #f59e0b; letter-spacing: 0.5px; text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3); }
    .logo span { color: #ef4444; }
    .balance-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1.5px solid #f59e0b; padding: 5px 12px; border-radius: 14px; font-weight: 800; font-size: 13px; color: #fef08a; box-shadow: 0 0 12px rgba(245, 158, 11, 0.2); }

    /* KHUNG GAME CHÍNH */
    .slot-container-7x5 {
      background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
      border: 2.5px solid #f59e0b;
      border-radius: 20px;
      padding: 10px;
      width: 100%;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.25);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* HŨ JACKPOT */
    .jackpot-display-v3 {
      background: linear-gradient(180deg, #1a1003 0%, #000 100%);
      border: 2px solid #fbbf24;
      color: #fbbf24;
      font-size: 19px;
      font-weight: 900;
      border-radius: 12px;
      padding: 6px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
      box-shadow: inset 0 0 15px rgba(245, 158, 11, 0.3);
    }

    /* THANH TRẠNG THÁI FREE SPIN & NHÂN */
    .status-badges { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .multiplier-badge {
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    .free-spins-counter {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
    }

    /* LƯỚI 7x5 */
    .grid-7x5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(7, 44px);
      gap: 4px;
      background: #020617;
      padding: 6px;
      border-radius: 14px;
      border: 2px solid #9333ea;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .slot-cell {
      height: 44px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
    }

    .slot-cell.exploding {
      transform: scale(0.1) rotate(25deg);
      opacity: 0;
      background: #ef4444 !important;
      border-color: #fca5a5 !important;
    }

    /* Ô NỀN BÊN DƯỚI KHẨU SÚNG 4 Ô */
    .slot-cell.gun-underlay {
      background: rgba(14, 165, 233, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
    }

    /* KHỐI 1 CÂY SÚNG NGUYÊN VẸN DÀI BẰNG 4 Ô */
    .giant-gun-overlay {
      position: absolute;
      z-index: 10;
      pointer-events: none;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(2, 132, 199, 0.92) 0%, rgba(15, 23, 42, 0.96) 50%, rgba(3, 105, 161, 0.95) 100%);
      border: 2px solid #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.8), inset 0 0 15px rgba(125, 211, 252, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
      overflow: hidden;
      animation: dropGiantGun 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Tia quét năng lượng chạy dọc thân súng */
    .giant-gun-overlay::after {
      content: '';
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      animation: gunLaserScan 2.2s infinite linear;
    }

    .giant-gun-badge {
      background: #ef4444;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 6px;
      border: 1px solid #fef08a;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
      z-index: 2;
    }

    @keyframes dropGiantGun {
      0% { transform: translateY(-80px) scale(1.15); opacity: 0; filter: brightness(2.5); }
      70% { transform: translateY(4px) scale(0.98); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; filter: brightness(1); }
    }

    @keyframes gunLaserScan {
      0% { top: -60%; }
      100% { top: 140%; }
    }

    /* HIỆU ỨNG SCATTER CẦU VỒNG */
    .slot-cell.scatter-cell {
      border: 1.5px solid #fef08a;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.9);
      z-index: 2;
      overflow: hidden;
    }
    .slot-cell.scatter-cell::before {
      content: '';
      position: absolute;
      width: 160%;
      height: 160%;
      background: conic-gradient(#ef4444, #f59e0b, #22c55e, #3b82f6, #a855f7, #ef4444);
      animation: spinRainbowRail 2.5s linear infinite;
      z-index: -2;
    }
    .slot-cell.scatter-cell::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: #1e1b4b;
      border-radius: 6px;
      z-index: -1;
    }

    @keyframes spinRainbowRail {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* BANNER KẾT QUẢ */
    .result-banner { 
      font-size: 17px; 
      font-weight: 900; 
      color: #fbbf24; 
      margin: 8px 0 6px; 
      min-height: 24px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    /* POPUP THẮNG LỚN */
    .win-popup-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99;
      border-radius: 18px;
      animation: fadeInPopup 0.3s ease;
    }
    .win-popup-content {
      background: linear-gradient(135deg, #92400e, #d97706);
      border: 3px solid #fef08a;
      padding: 20px 24px;
      border-radius: 20px;
      text-align: center;
      max-width: 88%;
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.6);
    }
    .win-popup-title { font-size: 18px; font-weight: 900; color: #fff; }
    .win-popup-amount { font-size: 26px; font-weight: 900; color: #fef08a; text-shadow: 0 2px 8px #000; margin: 8px 0; }
    .win-popup-sub { font-size: 12px; font-weight: 700; color: #fef3c7; margin-bottom: 10px; }
    .win-popup-timer { font-size: 11px; color: #fef08a; font-weight: 700; margin-top: 8px; }
    
    @keyframes fadeInPopup {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* KHU VỰC CHỌN CƯỢC & ĐIỀU KHIỂN */
    .bet-selector-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 6px 0 8px; }
    .btn-bet-opt { 
      background: #1e293b; 
      border: 1px solid #475569; 
      color: #cbd5e1; 
      padding: 6px 0; 
      border-radius: 8px; 
      font-size: 11px; 
      font-weight: 800; 
      cursor: pointer; 
      transition: 0.15s;
    }
    .btn-bet-opt.active { 
      background: linear-gradient(135deg, #9333ea, #7e22ce); 
      border-color: #d8b4fe; 
      color: #fff; 
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }
    
    button:disabled { opacity: 0.4 !important; cursor: not-allowed !important; filter: grayscale(60%); }

    .btn-buy-scatter { 
      width: 100%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6); 
      border: 1.5px solid #f472b6; 
      color: #fff; 
      padding: 7px 12px; 
      border-radius: 10px; 
      font-weight: 900; 
      font-size: 12px; 
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
      margin-bottom: 8px;
    }
    
    .control-panel-row { display: flex; gap: 6px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .auto-panel { display: flex; gap: 4px; background: #020617; padding: 4px 6px; border-radius: 10px; border: 1px solid #334155; }
    .btn-auto-item { background: #1e293b; border: 1px solid #475569; color: #cbd5e1; padding: 4px 7px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer; }
    .btn-auto-item.active { background: #ec4899; border-color: #f9a8d4; color: #fff; }

    .btn-turbo { 
      background: #1e293b; 
      border: 1px solid #475569; 
      color: #cbd5e1; 
      padding: 6px 10px; 
      border-radius: 10px; 
      font-size: 10px; 
      font-weight: 900; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .btn-turbo.active { 
      background: linear-gradient(135deg, #22c55e, #16a34a); 
      border-color: #86efac; 
      color: #fff; 
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5); 
    }

    .btn-spin-7x5 { 
      background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); 
      border: 2px solid #fef08a; 
      color: #fff; 
      font-size: 16px; 
      font-weight: 900; 
      padding: 12px 0; 
      border-radius: 16px; 
      cursor: pointer; 
      width: 100%; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      transition: transform 0.1s;
    }
    .btn-spin-7x5:active:not(:disabled) { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="casino-app">
    <header class="game-header">
      <div class="header-left">
        <button id="btn-back" class="btn-back" onclick="goBackLobby()">⬅ Sảnh</button>
        <div class="logo">🎰 NỔ<span>HŨ</span></div>
      </div>
      <div class="header-right">
        <div class="balance-card">
          <span class="coin-icon">💰</span>
          <span id="balance">0</span> đ
        </div>
      </div>
    </header>

    <main class="casino-board">
      <div class="slot-container-7x5">
        <div class="win-popup-overlay" id="win-popup">
          <div class="win-popup-content">
            <div class="win-popup-title" id="popup-title">🎉 THẮNG LỚN! 🎉</div>
            <div class="win-popup-amount" id="popup-amount">+0đ</div>
            <div class="win-popup-sub" id="popup-sub" style="display:none;"></div>
            <button class="btn-confirm" onclick="closeWinPopup()" style="padding: 9px 24px; font-size: 13px; background: #22c55e; color: #fff; border: 2px solid #fff; border-radius: 12px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4);">NHẬN THƯỞNG</button>
            <div class="win-popup-timer" id="popup-timer">3s...</div>
          </div>
        </div>

        <div class="jackpot-display-v3">💰 HŨ: <span id="jackpot-val">1,000,000,000</span>đ</div>

        <div class="status-badges">
          <div id="free-spins-box" style="display: none;">
            <div class="free-spins-counter">🎁 FREE SPINS: <span id="fs-count">0</span></div>
          </div>
          <div id="multiplier-box" style="display: none;">
            <div class="multiplier-badge">NHÂN LƯỢT ĂN: <span id="multi-val">x1</span></div>
          </div>
        </div>

        <div class="grid-7x5" id="grid-board"></div>

        <div class="result-banner" id="nohu-banner">+0đ</div>

        <div class="bet-selector-row">
          <button class="btn-bet-opt active" onclick="setBet(400, this)">0.4K</button>
          <button class="btn-bet-opt" onclick="setBet(1000, this)">1K</button>
          <button class="btn-bet-opt" onclick="setBet(5000, this)">5K</button>
          <button class="btn-bet-opt" onclick="setBet(10000, this)">10K</button>
          <button class="btn-bet-opt" onclick="setBet(50000, this)">50K</button>
          <button class="btn-bet-opt" onclick="setBet(100000, this)">100K</button>
          <button class="btn-bet-opt" onclick="setBet(500000, this)">500K</button>
          <button class="btn-bet-opt" onclick="setBet(1000000, this)">1M</button>
        </div>

        <button class="btn-buy-scatter" id="btn-buy-scatter" onclick="buyScatterFeature()">⚡ MUA SCATTER (<span id="buy-price">30,000</span>đ)</button>

        <div class="control-panel-row">
          <button class="btn-turbo" id="btn-turbo" onclick="toggleTurbo()">⚡ TĂNG TỐC: TẮT</button>
          <div class="auto-panel">
            <span style="font-size: 10px; color: #94a3b8; align-self: center; font-weight: 800; margin-right: 2px;">AUTO:</span>
            <button class="btn-auto-item active" onclick="setAutoMode(0, this)">TẮT</button>
            <button class="btn-auto-item" onclick="setAutoMode(10, this)">10</button>
            <button class="btn-auto-item" onclick="setAutoMode(50, this)">50</button>
            <button class="btn-auto-item" onclick="setAutoMode('INFINITY', this)">♾️</button>
          </div>
        </div>

        <button class="btn-spin-7x5" id="btn-spin" onclick="handleSpinClick()">🎰 QUAY NGAY</button>
      </div>
    </main>
  </div>

  <script>
    let balance = localStorage.getItem('sunbip_balance') !== null ? parseFloat(localStorage.getItem('sunbip_balance')) : 100000;
    let jackpot = localStorage.getItem('sunbip_jackpot') !== null ? parseFloat(localStorage.getItem('sunbip_jackpot')) : 1000000000;
    
    let currentBet = 400;
    let freeSpinsRemaining = 0;
    let autoRemaining = 0;
    let isSpinning = false;
    let isTurboOn = false; 
    
    let currentSpinMultiplier = 1; 
    let cascadeSteps = 0;
    
    let sessionTotalWin = 0;
    let freeSpinAccumulatedWin = 0;
    let isScatterSessionActive = false; 

    let persistentVerticalGun = null;

    let waitingForScatterConfirm = false;
    let popupAutoCloseTimer = null;
    let popupTimerTick = null;

    let gridData = Array(7).fill(null).map(() => Array(5).fill('💎'));
    const symbolSpawnPooL = ['🍋', '🍋', '🍉', '🍉', '🔔', '🔔', '7️⃣', '👑', '💎'];
    
    const symbolWeights = { 
      '🍋': 0.04,  
      '🍉': 0.08,  
      '🔔': 0.20,  
      '7️⃣': 0.5,   
      '👑': 2.0,  
      '💎': 6.0,
      '🔫': 0.5   
    };

    const balanceEl = document.getElementById('balance');
    const jackpotEl = document.getElementById('jackpot-val');
    const banner = document.getElementById('nohu-banner');
    const btnSpin = document.getElementById('btn-spin');
    const gridBoard = document.getElementById('grid-board');
    const buyPriceEl = document.getElementById('buy-price');

    if (balanceEl) balanceEl.textContent = Math.round(balance).toLocaleString();
    if (jackpotEl) jackpotEl.textContent = Math.round(jackpot).toLocaleString();

    function initBoard() {
      if (!gridBoard) return;
      gridBoard.innerHTML = '';
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          const cell = document.createElement('div');
          cell.className = 'slot-cell';
          cell.id = `cell-${r}-${c}`;
          cell.textContent = getRandomSymbol();
          gridBoard.appendChild(cell);
        }
      }
    }

    function getRandomSymbol() {
      return symbolSpawnPooL[Math.floor(Math.random() * symbolSpawnPooL.length)];
    }

    initBoard();

    function toggleTurbo() {
      isTurboOn = !isTurboOn;
      const turboBtn = document.getElementById('btn-turbo');
      if (turboBtn) {
        if (isTurboOn) {
          turboBtn.classList.add('active');
          turboBtn.textContent = '⚡ TĂNG TỐC: BẬT';
        } else {
          turboBtn.classList.remove('active');
          turboBtn.textContent = '⚡ TĂNG TỐC: TẮT';
        }
      }
    }

    function goBackLobby() {
      if (freeSpinsRemaining > 0 || isScatterSessionActive) return;
      stopAutoSpin();
      if (banner) {
        banner.style.color = '#38bdf8';
        banner.textContent = 'Đã dừng Auto Spin';
      }
    }

    function setBet(val, btn) {
      if (isSpinning || waitingForScatterConfirm || freeSpinsRemaining > 0 || isScatterSessionActive) return;
      currentBet = val;
      document.querySelectorAll('.btn-bet-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      let buyCost = Math.round(currentBet * 75);
      if (buyPriceEl) buyPriceEl.textContent = buyCost.toLocaleString();
    }

    function setAutoMode(mode, btn) {
      if (isSpinning || freeSpinsRemaining > 0 || isScatterSessionActive) return;
      autoRemaining = mode;
      document.querySelectorAll('.btn-auto-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function handleSpinClick() {
      if (waitingForScatterConfirm) {
        closeWinPopup();
        return;
      }
      if (freeSpinsRemaining > 0 || isScatterSessionActive) return;

      if (autoRemaining !== 0 && isSpinning) { 
        stopAutoSpin(); 
        return; 
      }
      spinSlot(false);
    }

    function stopAutoSpin() {
      autoRemaining = 0;
      if (btnSpin && freeSpinsRemaining <= 0 && !isScatterSessionActive) {
        btnSpin.disabled = false;
        btnSpin.textContent = '🎰 QUAY NGAY';
      }
      document.querySelectorAll('.btn-auto-item').forEach(b => b.classList.remove('active'));
      if (document.querySelectorAll('.btn-auto-item')[0]) {
        document.querySelectorAll('.btn-auto-item')[0].classList.add('active');
      }
    }

    function buyScatterFeature() {
      if (isSpinning || waitingForScatterConfirm || freeSpinsRemaining > 0 || isScatterSessionActive) return;
      let buyCost = Math.round(currentBet * 75);
      if (balance < buyCost) {
        if (banner) {
          banner.textContent = `❌ Không đủ tiền (${buyCost.toLocaleString()}đ)!`;
          banner.style.color = '#f87171';
        }
        return;
      }
      balance -= buyCost;
      saveData();
      updateUI();
      spinSlot(true);
    }

    function updateControlLockState() {
      const isLocked = (freeSpinsRemaining > 0 || isScatterSessionActive);
      
      document.querySelectorAll('.btn-bet-opt').forEach(b => b.disabled = isLocked);
      document.querySelectorAll('.btn-auto-item').forEach(b => b.disabled = isLocked);
      
      const buyBtn = document.getElementById('btn-buy-scatter');
      if (buyBtn) buyBtn.disabled = isLocked;

      const backBtn = document.getElementById('btn-back');
      if (backBtn) backBtn.disabled = isLocked;

      const turboBtn = document.getElementById('btn-turbo');
      if (turboBtn) turboBtn.disabled = isLocked;
    }

    function removeGiantGunOverlay() {
      const oldGun = document.getElementById('giant-gun-overlay');
      if (oldGun) oldGun.remove();
    }

    function renderGiantGunOverlay() {
      removeGiantGunOverlay();
      if (!persistentVerticalGun || persistentVerticalGun.length < 4 || !gridBoard) return;

      const topCell = document.getElementById(`cell-${persistentVerticalGun[0].r}-${persistentVerticalGun[0].c}`);
      const bottomCell = document.getElementById(`cell-${persistentVerticalGun[3].r}-${persistentVerticalGun[3].c}`);
      if (!topCell || !bottomCell) return;

      const gunEl = document.createElement('div');
      gunEl.id = 'giant-gun-overlay';
      gunEl.className = 'giant-gun-overlay';
      
      // Căn chỉnh tọa độ khớp 100% chiều rộng 1 ô và chiều cao 4 ô (bao gồm gap)
      gunEl.style.left = topCell.offsetLeft + 'px';
      gunEl.style.top = topCell.offsetTop + 'px';
      gunEl.style.width = topCell.offsetWidth + 'px';
      gunEl.style.height = (bottomCell.offsetTop + bottomCell.offsetHeight - topCell.offsetTop) + 'px';

      // Vẽ 1 khẩu súng trường năng lượng nguyên vẹn dài suốt 4 ô bằng SVG
      gunEl.innerHTML = `
        <span class="giant-gun-badge">WILD x4</span>
        <svg viewBox="0 0 60 180" style="width: 85%; height: 78%; filter: drop-shadow(0 0 6px #38bdf8);">
          <!-- Báng súng trên -->
          <path d="M22 6 H38 L41 34 H19 Z" fill="#1e293b" stroke="#7dd3fc" stroke-width="2"/>
          <rect x="25" y="12" width="10" height="16" rx="2" fill="#0ea5e9"/>
          <!-- Thân súng & ống ngắm -->
          <rect x="21" y="34" width="18" height="58" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
          <rect x="13" y="46" width="8" height="28" rx="3" fill="#0284c7" stroke="#bae6fd" stroke-width="1.5"/>
          <circle cx="17" cy="60" r="3" fill="#fef08a"/>
          <!-- Lõi năng lượng giữa thân -->
          <rect x="27" y="42" width="6" height="42" rx="3" fill="#38bdf8"/>
          <rect x="29" y="45" width="2" height="36" fill="#ffffff"/>
          <!-- Băng đạn chéo -->
          <path d="M39 62 L49 74 L45 84 L39 76 Z" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
          <!-- Nòng súng dài xuyên xuống dưới -->
          <rect x="25" y="92" width="10" height="62" fill="#334155" stroke="#7dd3fc" stroke-width="2"/>
          <line x1="30" y1="94" x2="30" y2="152" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4"/>
          <!-- Đầu nòng giảm thanh & tia laser -->
          <rect x="22" y="154" width="16" height="14" rx="2" fill="#0284c7" stroke="#fef08a" stroke-width="2"/>
          <polygon points="30,178 24,168 36,168" fill="#ef4444"/>
        </svg>
        <span class="giant-gun-badge" style="background:#0284c7;">4 Ô</span>
      `;

      gridBoard.appendChild(gunEl);
    }

    function spinSlot(isBuyFeature = false) {
      if (isSpinning) return;
      if (!isBuyFeature && freeSpinsRemaining <= 0 && balance < currentBet) {
        if (banner) {
          banner.textContent = "❌ Số dư không đủ!";
          banner.style.color = "#f87171";
        }
        stopAutoSpin();
        return;
      }

      isSpinning = true;
      sessionTotalWin = 0; 
      
      if (freeSpinsRemaining <= 0 && !isScatterSessionActive) {
        freeSpinAccumulatedWin = 0;
        persistentVerticalGun = null;
        removeGiantGunOverlay();
      }

      if (btnSpin) {
        btnSpin.disabled = true;
        btnSpin.textContent = "🌀 ĐANG QUAY...";
      }
      cascadeSteps = 0;
      
      if (freeSpinsRemaining > 0 || isScatterSessionActive) {
        currentSpinMultiplier = 8; 
      } else {
        currentSpinMultiplier = 1;
      }

      const multiBox = document.getElementById('multiplier-box');
      const multiVal = document.getElementById('multi-val');
      if (multiBox) multiBox.style.display = 'block';
      if (multiVal) multiVal.textContent = `x${currentSpinMultiplier}`;

      if (freeSpinsRemaining > 0) {
        freeSpinsRemaining--;
        updateFreeSpinsUI();
      } else if (!isBuyFeature) {
        balance -= currentBet;
        jackpot += Math.floor(currentBet * 0.05);
        saveData();
        updateUI();
      }

      updateControlLockState();

      if (banner) {
        banner.style.color = '#fbbf24';
        let currentDisplay = (freeSpinsRemaining > 0 || isScatterSessionActive) ? freeSpinAccumulatedWin : 0;
        banner.textContent = `+${Math.round(currentDisplay).toLocaleString()}đ`;
      }
      
      document.querySelectorAll('.slot-cell').forEach(el => {
        el.classList.remove('scatter-cell', 'exploding');
      });

      let count = 0;
      let intervalTime = isTurboOn ? 80 : 220;
      let maxCount = isTurboOn ? 5 : 8;

      let spinInterval = setInterval(() => {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 5; c++) {
            let cell = document.getElementById(`cell-${r}-${c}`);
            if (cell) {
              let isGunCell = persistentVerticalGun && persistentVerticalGun.some(p => p.r === r && p.c === c);
              if (!isGunCell) {
                cell.className = 'slot-cell';
                cell.textContent = getRandomSymbol();
              }
            }
          }
        }
        count++;
        if (count >= maxCount) {
          clearInterval(spinInterval);
          generateBoardResult(isBuyFeature);
        }
      }, intervalTime);
    }

    function generateBoardResult(isBuyFeature) {
      gridData = Array(7).fill(null).map(() => Array(5).fill(null));

      if (persistentVerticalGun) {
        persistentVerticalGun.forEach(p => {
          gridData[p.r][p.c] = '🔫';
        });
      }

      let scatterAmount = 0;
      if (isBuyFeature) {
        scatterAmount = Math.random() > 0.5 ? 4 : 3;
      } else {
        let chance = Math.random();
        if (chance < 0.012) {
          scatterAmount = chance < 0.0015 ? 4 : (chance < 0.004 ? 3 : (chance < 0.008 ? 2 : 1));
        }
      }

      if (scatterAmount > 0) {
        let cols = [0, 1, 2, 3, 4];
        cols.sort(() => Math.random() - 0.5); 
        for (let i = 0; i < scatterAmount && i < 5; i++) {
          let chosenCol = cols[i];
          let chosenRow = Math.floor(Math.random() * 7); 
          if (!gridData[chosenRow][chosenCol]) {
            gridData[chosenRow][chosenCol] = '♾️';
          }
        }
      }

      if (!persistentVerticalGun) {
        let gunChance = (freeSpinsRemaining > 0 || isScatterSessionActive) ? 0.015 : 0.08;
        if (Math.random() < gunChance) {
          let availableCols = [];
          for (let c = 0; c < 5; c++) {
            let hasScatter = false;
            for (let r = 0; r < 7; r++) {
              if (gridData[r][c] === '♾️') hasScatter = true;
            }
            if (!hasScatter) availableCols.push(c);
          }

          if (availableCols.length > 0) {
            let col = availableCols[Math.floor(Math.random() * availableCols.length)];
            let startRow = Math.floor(Math.random() * 4);
            
            persistentVerticalGun = [];
            for (let i = 0; i < 4; i++) {
              let r = startRow + i;
              if (!gridData[r][col]) {
                gridData[r][col] = '🔫';
                persistentVerticalGun.push({ r: r, c: col });
              }
            }
          }
        }
      }

      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          if (gridData[r][c] === null) {
            gridData[r][c] = getRandomSymbol();
          }
        }
      }

      renderGridUI();
      
      let waitTime = isTurboOn ? 250 : 550;
      setTimeout(() => {
        checkClusterAndCascade();
      }, waitTime);
    }

    function renderGridUI() {
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          let el = document.getElementById(`cell-${r}-${c}`);
          if (el) {
            el.className = 'slot-cell';
            el.textContent = '';

            if (gridData[r][c] === '♾️') {
              el.textContent = '♾️';
              el.classList.add('scatter-cell');
            } else if (gridData[r][c] === '🔫') {
              el.classList.add('gun-underlay');
            } else {
              el.textContent = gridData[r][c];
            }
          }
        }
      }

      // Hiển thị 1 cây súng nguyên vẹn có chiều dài bằng 4 ô
      if (persistentVerticalGun && persistentVerticalGun.length === 4) {
        if (!document.getElementById('giant-gun-overlay')) {
          renderGiantGunOverlay();
        }
      } else {
        removeGiantGunOverlay();
      }
    }

    function checkClusterAndCascade() {
      cascadeSteps++;
      if (cascadeSteps > 15) { endSpinSession(); return; }

      let visited = Array(7).fill(null).map(() => Array(5).fill(false));
      let matchedClusters = [];
      let scatterCount = 0;

      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          let sym = gridData[r][c];
          if (sym === '♾️') { scatterCount++; continue; }
          if (!sym || visited[r][c] || sym === '🔫') continue; 

          let cluster = [];
          let queue = [[r, c]];
          visited[r][c] = true;

          while (queue.length > 0) {
            let [currR, currC] = queue.shift();
            cluster.push([currR, currC]);

            let neighbors = [
              [currR - 1, currC], [currR + 1, currC],
              [currR, currC - 1], [currR, currC + 1]
            ];

            for (let [nR, nC] of neighbors) {
              if (nR >= 0 && nR < 7 && nC >= 0 && nC < 5 && !visited[nR][nC]) {
                let neighborSym = gridData[nR][nC];
                if (neighborSym === sym || neighborSym === '🔫') {
                  visited[nR][nC] = true;
                  queue.push([nR, nC]);
                }
              }
            }
          }

          if (cluster.length >= 5) {
            matchedClusters.push({ sym: sym, cells: cluster });
          }
        }
      }

      if (scatterCount >= 3) {
        let addedSpins = 10 + (scatterCount - 3) * 2;
        freeSpinsRemaining += addedSpins;
        isScatterSessionActive = true;
        currentSpinMultiplier = 8; 
        
        updateFreeSpinsUI();
        updateControlLockState();

        const multiBox = document.getElementById('multiplier-box');
        const multiVal = document.getElementById('multi-val');
        if (multiBox) multiBox.style.display = 'block';
        if (multiVal) multiVal.textContent = `x${currentSpinMultiplier}`;

        if (typeof confetti === 'function') confetti({ particleCount: 250, spread: 120 });

        showScatterWinPopup(scatterCount, addedSpins, freeSpinAccumulatedWin);
        return;
      }

      if (matchedClusters.length > 0) {
        const multiBox = document.getElementById('multiplier-box');
        const multiVal = document.getElementById('multi-val');
        if (multiBox) multiBox.style.display = 'block';
        if (multiVal) multiVal.textContent = `x${currentSpinMultiplier}`;

        let stepWin = 0;
        let explodedCellsMap = {};

        matchedClusters.forEach(clusterObj => {
          let weight = symbolWeights[clusterObj.sym] || 0.04;
          let clusterValue = clusterObj.cells.length * currentBet * weight * currentSpinMultiplier;
          stepWin += clusterValue;

          clusterObj.cells.forEach(([r, c]) => {
            if (gridData[r][c] !== '🔫') {
              explodedCellsMap[`${r},${c}`] = true;
              let cell = document.getElementById(`cell-${r}-${c}`);
              if (cell) cell.classList.add('exploding');
            }
          });
        });

        for (let key in explodedCellsMap) {
          let [r, c] = key.split(',').map(Number);
          gridData[r][c] = null;
        }

        sessionTotalWin += stepWin;
        freeSpinAccumulatedWin += stepWin;
        balance += stepWin;

        if (banner) {
          banner.style.color = '#fbbf24';
          let activeWinDisplay = (freeSpinsRemaining > 0 || isScatterSessionActive) ? freeSpinAccumulatedWin : sessionTotalWin;
          banner.textContent = `+${Math.round(activeWinDisplay).toLocaleString()}đ`;
        }
        saveData();
        updateUI();

        if (currentSpinMultiplier < 1024) {
          currentSpinMultiplier *= 2;
          if (multiVal) multiVal.textContent = `x${currentSpinMultiplier}`;
        }

        let cascadeWait = isTurboOn ? 250 : 600;
        setTimeout(() => { applySlideDownAndFillAll(); }, cascadeWait);
      } else {
        endSpinSession();
      }
    }

    function applySlideDownAndFillAll() {
      for (let c = 0; c < 5; c++) {
        let writeRow = 6;
        for (let r = 6; r >= 0; r--) {
          if (gridData[r][c] !== null && gridData[r][c] !== '🔫') {
            gridData[writeRow][c] = gridData[r][c];
            if (writeRow !== r) gridData[r][c] = null;
            writeRow--;
          }
        }
        for (let r = writeRow; r >= 0; r--) {
          if (gridData[r][c] !== '🔫') {
            gridData[r][c] = getRandomSymbol();
          }
        }
      }

      renderGridUI();
      let slideWait = isTurboOn ? 250 : 550;
      setTimeout(() => { checkClusterAndCascade(); }, slideWait);
    }

    function endSpinSession() {
      isSpinning = false;

      if (freeSpinsRemaining <= 0) {
        persistentVerticalGun = null;
      }

      if (freeSpinsRemaining > 0) {
        let nextSpinWait = isTurboOn ? 300 : 900;
        setTimeout(() => {
          spinSlot(false);
        }, nextSpinWait);
        return;
      }

      if (isScatterSessionActive) {
        isScatterSessionActive = false;
        persistentVerticalGun = null;
        removeGiantGunOverlay();
        updateControlLockState();
        showScatterFinalWinPopup(freeSpinAccumulatedWin);
        return;
      }

      updateControlLockState();

      let finalDisplay = (freeSpinAccumulatedWin > 0) ? freeSpinAccumulatedWin : sessionTotalWin;
      if (banner) {
        banner.style.color = finalDisplay > 0 ? '#4ade80' : '#94a3b8';
        banner.textContent = `+${Math.round(finalDisplay).toLocaleString()}đ`;
      }

      finishSpinState();
    }

    function finishSpinState() {
      if (autoRemaining !== 0) {
        if (typeof autoRemaining === 'number') {
          autoRemaining--;
          if (autoRemaining <= 0) { stopAutoSpin(); return; }
        }
        let autoWait = isTurboOn ? 300 : 900;
        setTimeout(() => {
          let popupEl = document.getElementById('win-popup');
          if (!popupEl || popupEl.style.display === 'none') {
            spinSlot(false);
          }
        }, autoWait);
      } else {
        if (btnSpin) {
          btnSpin.disabled = false;
          btnSpin.textContent = '🎰 QUAY NGAY';
        }
      }
    }

    function showScatterWinPopup(count, spins, currentTotalWin) {
      const titleEl = document.querySelector('.win-popup-title');
      const amountEl = document.getElementById('popup-amount');
      const subEl = document.getElementById('popup-sub');
      const popupEl = document.getElementById('win-popup');
      const timerEl = document.getElementById('popup-timer');

      if (titleEl) titleEl.textContent = '⚡ TRÚNG FREE SPINS! ⚡';
      if (amountEl) amountEl.textContent = `+${spins} VÒNG QUAY`;
      
      if (subEl) {
        subEl.style.display = 'block';
        subEl.textContent = `VÀO VÒNG FREE SPIN (Súng Wild 4 ô bám trụ suốt vòng quay)`;
      }

      if (popupEl) popupEl.style.display = 'flex';

      let secLeft = 5;
      if (timerEl) timerEl.textContent = `Tự động vào sau ${secLeft}s...`;

      waitingForScatterConfirm = true;
      if (btnSpin) {
        btnSpin.disabled = false;
        btnSpin.textContent = `✔ XÁC NHẬN (${secLeft}s)`;
      }

      clearInterval(popupTimerTick);
      popupTimerTick = setInterval(() => {
        secLeft--;
        if (secLeft > 0) {
          if (timerEl) timerEl.textContent = `Tự động vào sau ${secLeft}s...`;
          if (waitingForScatterConfirm && btnSpin) btnSpin.textContent = `✔ XÁC NHẬN (${secLeft}s)`;
        } else {
          clearInterval(popupTimerTick);
          if (waitingForScatterConfirm) {
            closeWinPopup();
          }
        }
      }, 1000);
    }

    function proceedFreeSpinsSequence() {
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 5; c++) {
          if (gridData[r][c] === '♾️') {
            let cell = document.getElementById(`cell-${r}-${c}`);
            if (cell) cell.classList.add('exploding');
            gridData[r][c] = null;
          }
        }
      }
      let proceedWait = isTurboOn ? 250 : 550;
      setTimeout(() => { applySlideDownAndFillAll(); }, proceedWait);
    }

    function showScatterFinalWinPopup(totalAmount) {
      const titleEl = document.querySelector('.win-popup-title');
      const amountEl = document.getElementById('popup-amount');
      const subEl = document.getElementById('popup-sub');
      const popupEl = document.getElementById('win-popup');
      const timerEl = document.getElementById('popup-timer');

      if (titleEl) titleEl.textContent = '🎁 KẾT THÚC CHUỖI FREE SPINS! 🎁';
      if (amountEl) amountEl.textContent = `+${Math.round(totalAmount).toLocaleString()}đ`;
      
      if (subEl) {
        subEl.style.display = 'block';
        subEl.textContent = `TỔNG TIỀN THẮNG FREE SPIN`;
      }

      if (popupEl) popupEl.style.display = 'flex';
      if (typeof confetti === 'function') confetti({ particleCount: 300, spread: 130 });

      let secLeft = 4;
      if (timerEl) timerEl.textContent = `Tự nhận sau ${secLeft}s...`;
      
      clearInterval(popupTimerTick);
      popupTimerTick = setInterval(() => {
        secLeft--;
        if (secLeft > 0) {
          if (timerEl) timerEl.textContent = `Tự nhận sau ${secLeft}s...`;
        } else {
          clearInterval(popupTimerTick);
        }
      }, 1000);

      clearTimeout(popupAutoCloseTimer);
      popupAutoCloseTimer = setTimeout(() => { closeWinPopup(); }, 4000);
    }

    function closeWinPopup() {
      clearTimeout(popupAutoCloseTimer);
      clearInterval(popupTimerTick);
      const popupEl = document.getElementById('win-popup');
      if (popupEl) popupEl.style.display = 'none';

      if (waitingForScatterConfirm) {
        waitingForScatterConfirm = false;
        if (btnSpin) {
          btnSpin.disabled = true;
          btnSpin.textContent = '🌀 ĐANG QUAY...';
        }
        proceedFreeSpinsSequence();
        return;
      }

      finishSpinState();
    }

    function updateFreeSpinsUI() {
      const fsBox = document.getElementById('free-spins-box');
      const fsCount = document.getElementById('fs-count');
      if (freeSpinsRemaining > 0) {
        if (fsBox) fsBox.style.display = 'block';
        if (fsCount) fsCount.textContent = freeSpinsRemaining;
      } else {
        if (fsBox) fsBox.style.display = 'none';
      }
    }

    function updateUI() {
      if (balanceEl) balanceEl.textContent = Math.round(balance).toLocaleString();
      if (jackpotEl) jackpotEl.textContent = Math.round(jackpot).toLocaleString();
    }

    function saveData() {
      localStorage.setItem('sunbip_balance', balance);
      localStorage.setItem('sunbip_jackpot', jackpot);
    }

    // Tự căn lại kích thước khẩu súng nếu đổi kích thước màn hình
    window.addEventListener('resize', () => {
      if (persistentVerticalGun && persistentVerticalGun.length === 4) {
        renderGiantGunOverlay();
      }
    });
  </script>
